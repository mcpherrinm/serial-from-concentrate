[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-rp = {
  version = "0.10.0",
  features = ["rp2040", "defmt", "time-driver", "critical-section-impl", "binary-info", "executor-thread"]
}
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

defmt = "1.2.0"
defmt-rtt = "1.3.1"

cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-usb = "0.6.0"
static_cell = "2.1.1"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
embassy-futures = "0.1.2"
