[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

# firmware is its own workspace
[workspace]

[features]
# Chip families
rp2040 = ["embassy-rp/rp2040"]
rp235x = []
rp235xa = ["rp235x", "embassy-rp/rp235xa"]
rp235xb = ["rp235x", "embassy-rp/rp235xb"]

# Boards (exactly one must be enabled)
pi-pico = ["rp2040"]
pi-pico-2 = ["rp235xa"]
peripheral-board = ["rp235xb"]

[dependencies]
cli = { path = "../shared/cli" }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-rp = {
  version = "0.10.0",
  features = ["defmt", "time-driver", "critical-section-impl", "binary-info", "executor-thread"]
}
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

defmt = "1.2.0"
defmt-rtt = "1.3.1"

cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-usb = "0.6.0"
static_cell = "2.1.1"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
embassy-futures = "0.1.2"
